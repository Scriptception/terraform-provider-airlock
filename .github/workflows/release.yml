name: release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  goreleaser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Resolve release version
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 0.2.2" >&2
            exit 1
          fi
          grep -Fqx "## ${version}" CHANGELOG.md

          tag="v${version}"
          git fetch --force --tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ -n "${WORKFLOW_RUN_SHA}" ]; then
            test "${WORKFLOW_RUN_SHA}" = "$(git rev-parse HEAD)"
          else
            ci_sha="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow test.yml \
              --branch main \
              --commit "$(git rev-parse HEAD)" \
              --event push \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // ""')"
            test "${ci_sha}" = "$(git rev-parse HEAD)"
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi

          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "${release_status}" in
            200) release_exists=true ;;
            404) release_exists=false ;;
            *)
              echo "GitHub release lookup failed with HTTP ${release_status}" >&2
              exit 1
              ;;
          esac
          if [ "${release_exists}" = "true" ]; then
            test "${tag_exists}" = "true"
          elif [ "${tag_exists}" = "true" ]; then
            test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)"
          fi

          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          printf 'tag_exists=%s\n' "${tag_exists}" >> "${GITHUB_OUTPUT}"
          printf 'release_exists=%s\n' "${release_exists}" >> "${GITHUB_OUTPUT}"
      - name: Verify source and tests
        if: steps.release.outputs.release_exists != 'true'
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build ./...
          go test ./...
      - name: Import GPG key
        if: steps.release.outputs.release_exists != 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Create release tag
        if: steps.release.outputs.release_exists != 'true' && steps.release.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field "ref=refs/tags/${RELEASE_TAG}" \
            --raw-field "sha=${RELEASE_SHA}" >/dev/null
      - name: Run GoReleaser
        if: steps.release.outputs.release_exists != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
